<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <P>Hrllo, World!😎</P>
    <strong class="Text">글자를 파란색으로!</strong>
</body>
<script>
    const p = document.getElementsByTagName("p")
    p[0].innerText-"수정!" //키가 있으면 수정 
    // 태그는  객체로 보자 

    const strong = document.getElementsByTagName()[0]
    console.log(strong)
</script>
</html>
