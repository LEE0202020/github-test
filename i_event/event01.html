<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트01</title>
</head>
<body>
    <p>CSS 동적 스타일 변경</p>
    <button>켜져라!</button>
</body>
<script>
    const p = document.querySelector(".text")
    const button = document.querySelector("button")
    button.addEventListener("click", (e) => {
        console.log("e", e)
        p.style.color= "blue";
        // 버튼을 눌렀을떄 폰트 크기를 30px로 변경 
        p.style.fontsize = "30px"
    })
    console.log(p)
    console.log(button)
</script>
</html>
